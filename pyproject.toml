[project]
name = "brownbox"
version = "0.1.0"
description = "Intent ontology and evaluation for BrownBox support conversations"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastembed>=0.8.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brownbox"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "fastembed.*"]
ignore_missing_imports = true
