# BrownBox customer intent ontology.
#
# What gets its own intent, tested in order:
#   1. The router can tell it apart from the customer's own words. If telling it apart
#      needs backend data (e.g. tracking status), it is one intent whose procedure branches.
#   2. Resolving it needs a different procedure: different steps, tools, policy or risk.
#   3. It carries at least 1% of DEV conversations (7+), unless it is a risk route
#      (handoff or never), which costs almost nothing to keep.
# Intents can share an agent. Cluster numbers refer to results/discovery/all-clusters.md.
# When the customer can't tell us which procedure they need (a fault with no remedy named, a
# login that fails for no known reason), the intent's procedure finds out from the systems and
# branches, or hands the conversation to another agent (hands_over_to): a planned hand-over,
# not a routing switch. It never asks the customer to diagnose what the systems already know.
#
# Participation: who runs the conversation.
#   ai       the AI handles it
#   handoff  a person handles it (emotional, relationship or legal risk)
#   never    no automated handling (security): the AI sends one fixed, pre-approved hand-over
#            message and transfers to a specialist team. It generates nothing else, asks
#            nothing and takes no action.
# signoff_actions: risky actions inside an AI intent. The AI prepares them; a person approves.
# Money rule (policy-based): standard refunds to the original payment method are AI actions.
# Money moving outside standard policy (another payment method, waivers, goodwill, out-of-policy
# returns) needs sign-off.
# Guards run on every customer message, including the first, and override any intent: the
# routing decision is a lookup in code, not something the model decides. When a guard fires,
# still record the closest intent (for reporting); the guard decides the routing.
# When a guard fires at any message: the AI stops from that message on; the conversation never
# returns to the AI; pending sign-off actions are cancelled; actions already taken in the
# conversation are listed in the hand-over for the specialist to review or reverse.
#
# "other" (nothing fits) and "unclear" (not enough said yet) are classifier outcomes, not
# intents. Examples are DEV conversation ids only. Validate with `make ontology`.

# v2 (2026-10-09), from labelling the practice set: faults with no remedy named go to the return
# intent, which troubleshoots and can hand over to the warranty agent; "can't log in, don't know
# why" goes to login_verification, which checks the account's state; tighter complaint and
# wants_human guards; cancelling a return, lost warranty cards and unexplained emails placed.
version: "2"

domains:
  - {id: orders, name: "Orders"}
  - {id: delivery, name: "Delivery"}
  - {id: returns, name: "Returns and refunds"}
  - {id: payments, name: "Payments, pricing and offers"}
  - {id: product, name: "Product support and warranty"}
  - {id: account, name: "Account and login"}
  - {id: shopping, name: "Shopping help before buying"}

intents:
  # --- Orders -------------------------------------------------------------------------
  - id: order_status  # cluster 12
    name: Check order status
    domain: orders
    definition: The customer wants to confirm an order went through or see what stage it is at.
    includes:
      - Confirming an order was placed or approved
      - What an order status shown on the website means
      - Emails or notifications about an order that the customer doesn't understand
    excludes:
      - The order is late, overdue or hasn't arrived (order_not_arrived)
      - Being asked to ship an item back (return_policy)
    boundaries:
      order_not_arrived: If the customer says it is late, overdue or missing, it's order_not_arrived.
      return_policy: An email asking them to ship an item back is return_policy.
    examples: [60, 302, 952]
    kind: inform
    requires_verification: true
    participation: ai
    agent: orders_agent

  - id: cancel_order  # cluster 20
    name: Cancel an order
    domain: orders
    definition: The customer wants to cancel an order that hasn't been delivered yet.
    includes:
      - Unshipped or processing orders
      - The website's cancel button isn't working
    excludes:
      - The item has already arrived (initiate_return)
    boundaries:
      initiate_return: Before delivery it's a cancellation; after delivery it's a return.
      change_delivery_address: Changing where it goes keeps the order; cancelling ends it.
    examples: [2, 246, 307]
    kind: act
    requires_verification: true
    participation: ai
    signoff_actions:
      - Cancel an order that has already been dispatched
      - Refund to a payment method other than the original one
    fraud_signals:
      - Asks for the refund to go to a different person or account
    agent: orders_agent

  - id: change_delivery_address  # cluster 14
    name: Change delivery or pickup address
    domain: orders
    definition: The customer wants to change the delivery or pickup address on an order, or add an address to their account.
    includes:
      - Orders already in transit
      - Adding a new saved address
    excludes:
      - An order already delivered to the wrong address (redeliver_order)
    boundaries:
      redeliver_order: Before a delivery attempt it's an address change; after a failed or wrong-address delivery it's redeliver_order.
    examples: [73, 398, 582]
    kind: act
    requires_verification: true
    participation: ai
    fraud_signals:
      - Asks to redirect a high-value order to a new address straight after an account change
    agent: orders_agent

  # --- Delivery -----------------------------------------------------------------------
  - id: order_not_arrived  # clusters 2 + part of 3 (P3: merged delay and marked-delivered-missing)
    name: Order not arrived
    domain: delivery
    definition: The customer's order hasn't reached them, whether it's late, untracked, or marked delivered but missing. The procedure checks tracking and branches.
    includes:
      - Late, delayed or unshipped orders
      - Tracking that isn't updating, or how to contact the courier
      - Asking to speed up an order that is already late
      - Tracking says delivered but nothing arrived, including parcels stolen from a doorstep
    excludes:
      - A delivery attempt the customer knows was missed or went to the wrong address (redeliver_order)
      - Someone else ordered on the customer's account (fraud guard)
    boundaries:
      order_status: A routine status check is order_status; late or missing is order_not_arrived.
      redeliver_order: If the customer asks to rebook a missed or misdirected delivery, it's redeliver_order.
      faster_delivery: Upgrading shipping on an order that isn't late is faster_delivery.
    examples: [98, 249, 354, 779]
    kind: inform
    requires_verification: true
    participation: ai
    signoff_actions:
      - Send a replacement or refund for a parcel marked delivered but not received
    fraud_signals:
      - Repeated "not received" claims on the account (backend check)
      - Claim contradicts the carrier's proof of delivery (backend check)
    agent: delivery_agent

  - id: redeliver_order  # part of cluster 3
    name: Arrange a redelivery
    domain: delivery
    definition: A delivery attempt failed, was missed or went to the wrong address, and the customer wants it delivered again. The procedure confirms the failed attempt with the carrier first.
    includes:
      - Rescheduling a missed delivery
      - Redelivering an order sent to the wrong address
      - The missing second package of a split order
    excludes:
      - The carrier shows a successful delivery (order_not_arrived)
    boundaries:
      order_not_arrived: A known missed or misdirected attempt is redeliver_order; anything the customer can't explain is order_not_arrived.
      change_delivery_address: Before any attempt it's an address change.
    examples: [244, 545, 860]
    kind: act
    requires_verification: true
    participation: ai
    fraud_signals:
      - Carrier shows a successful delivery the customer disputes (backend check)
    agent: delivery_agent

  - id: faster_delivery  # cluster 13
    name: Get faster delivery
    domain: delivery
    definition: The customer wants a quicker shipping option for an item or an order that is not late.
    includes:
      - Expedited shipping before or after buying
      - Store pickup as a faster alternative
    excludes:
      - The order is already late (order_not_arrived)
    boundaries:
      order_not_arrived: Speeding up a late order is order_not_arrived.
      delivery_charges: Asking what each option costs is delivery_charges.
    examples: [77, 162, 379]
    kind: act
    requires_verification: false
    participation: ai
    agent: delivery_agent

  - id: delivery_charges  # cluster 16
    name: Understand delivery charges
    domain: delivery
    definition: The customer wants to know what delivery costs or why an order didn't get free delivery.
    includes:
      - Shipping prices and speeds for an item
      - Why an order didn't qualify for free delivery
    excludes:
      - Wanting a delivery charge refunded (charge_dispute)
      - A charge on their own order they don't recognise (charge_dispute)
    boundaries:
      charge_dispute: How delivery is priced is delivery_charges; a charge on their own order that they don't recognise or want back is charge_dispute, whose procedure looks it up.
    examples: [110, 208, 710]
    kind: inform
    requires_verification: false
    participation: ai
    agent: knowledge_agent

  # --- Returns and refunds ------------------------------------------------------------
  - id: initiate_return  # clusters 1, 5, 6, 29 + returns from 3, 7, 15 (P1)
    name: Return, replace or report a faulty item
    domain: returns
    definition: The customer has an item that isn't right and wants it refunded, exchanged, replaced or completed, or reports a fault without saying what they want. For a fault, the procedure troubleshoots first; if that fails, it offers a return or replacement within the return window, and hands over to the warranty agent for a repair or outside the window. It checks eligibility (return window, condition, category) before booking anything.
    includes:
      - Defective, damaged, wrong, ill-fitting or unwanted items
      - A fault reported without naming a remedy ("it's not working")
      - Items delivered in a tampered or opened package
      - Missing parts or accessories (the procedure can send the part instead of a full return)
      - Items paid for by cash on delivery
      - Cancelling or changing a return already started
    excludes:
      - Asking for a repair, or invoking the warranty (warranty_claim)
      - Questions about the return policy with no return started (return_policy)
    boundaries:
      warranty_claim: A fault with no remedy named, or a return or replacement, is initiate_return; asking for a repair or invoking the warranty is warranty_claim.
      return_policy: Asking how returns work is return_policy; asking to start one is initiate_return.
      refund_status: Once the item is back and the customer is chasing the money, it's refund_status.
      cancel_order: Before delivery it's a cancellation.
    examples: [239, 204, 227, 330]
    kind: act
    requires_verification: true
    participation: ai
    signoff_actions:
      - Refund to a payment method other than the original one (e.g. bank details for a cash-on-delivery order)
      - Refund or replace outside the return policy (past the window, non-returnable item)
      - Waive a return fee
    fraud_signals:
      - Asks for the refund to go to a different person or account
      - Refuses to provide photos of damage when asked
      - Repeated damaged or wrong-item claims on the account (backend check)
    agent: returns_agent
    hands_over_to: [warranty_agent]

  - id: return_policy  # most of cluster 7 (P2)
    name: Return policy and process
    domain: returns
    definition: The customer wants to know how returns work for an item, without asking for money back.
    includes:
      - A seller's return policy, before or after buying
      - Return fees, return pickups and return shipping options
      - Why they were asked to ship an item back
    excludes:
      - Asking for a fee to be waived or refunded (charge_dispute)
    boundaries:
      charge_dispute: Explaining a fee is return_policy; reversing it is charge_dispute.
      initiate_return: Starting a return is initiate_return.
    examples: [187, 245, 581]
    kind: inform
    requires_verification: false
    participation: ai
    agent: returns_agent

  - id: refund_status  # cluster 11 + refund-timing goals from 15
    name: Chase a refund
    domain: returns
    definition: The customer returned or cancelled something and wants to know where their refund is or how it will be paid.
    includes:
      - Delayed or missing refunds
      - Refund timelines and refund methods, including cash on delivery
    excludes:
      - A refund smaller than expected that they want corrected (charge_dispute)
    boundaries:
      initiate_return: Before the item is sent back it's initiate_return.
      charge_dispute: Disputing the refund amount is charge_dispute.
    examples: [44, 337, 612]
    kind: inform
    requires_verification: true
    participation: ai
    agent: returns_agent

  # --- Payments, pricing and offers ---------------------------------------------------
  - id: charge_dispute  # cluster 18 + fee-waiver goals from 7 (P2)
    name: Dispute a charge or fee
    domain: payments
    definition: The customer thinks they were charged too much, or charged a fee they shouldn't pay, and wants it explained and refunded or waived.
    includes:
      - Overcharges and unexpected charges on an order
      - A charge on their order they don't recognise (the procedure looks up what it was for)
      - Return fees, courier costs or unwanted add-on charges they want back
    excludes:
      - Different prices on the website with no order affected (pricing_question)
      - Charges the customer says they never made (fraud guard)
    boundaries:
      pricing_question: If they were charged more on an order, it's charge_dispute; just asking about listed prices is pricing_question.
      delivery_charges: Asking why a delivery fee applies is delivery_charges.
    examples: [80, 126, 722, 758]
    kind: act
    requires_verification: true
    participation: ai
    signoff_actions:
      - Refund an overcharge or waive a fee
    fraud_signals:
      - Asks for the money to go to a different person or account
    agent: billing_agent

  - id: invoice_request  # cluster 32
    name: Get an invoice
    domain: payments
    definition: The customer wants an invoice for one or more past orders.
    includes:
      - Missing invoices, or invoices to be resent
    examples: [47, 81, 750]
    kind: act
    requires_verification: true
    participation: ai
    agent: billing_agent

  - id: pricing_question  # cluster 21
    name: Question about listed prices
    domain: payments
    definition: The customer wants to know why the same item shows different prices on the website.
    includes:
      - Different prices across listings, pages or checkout
    excludes:
      - Being charged more than the listed price on an order (charge_dispute)
    boundaries:
      charge_dispute: An affected order makes it charge_dispute.
    examples: [86, 209, 687]
    kind: inform
    requires_verification: false
    participation: ai
    agent: knowledge_agent

  - id: offers_and_discounts  # cluster 25 + cashback goals from 15 (P6)
    name: Offers, exchange deals and discounts
    domain: payments
    definition: The customer asks about an exchange (trade-in) offer, cashback or discount, or wants one applied to an order.
    includes:
      - How exchange offers and cashback work
      - Applying a missed or promised discount to an order
    excludes:
      - Loyalty points (loyalty_points)
    boundaries:
      loyalty_points: Points balances and redemption are loyalty_points.
    examples: [146, 215, 573]
    kind: act
    requires_verification: true
    participation: ai
    signoff_actions:
      - Apply a discount, price-drop adjustment or exchange value to an order
    fraud_signals:
      - Claims a promised discount that has no record (backend check)
    agent: billing_agent

  - id: loyalty_points  # cluster 30
    name: Loyalty points
    domain: payments
    definition: The customer wants to know how many loyalty points they earned or how to redeem them.
    includes:
      - A redemption that fails on the website
    boundaries:
      offers_and_discounts: Exchange offers and cashback are offers_and_discounts.
    examples: [75, 487, 964]
    kind: inform
    requires_verification: true
    participation: ai
    agent: billing_agent

  # --- Product support and warranty ---------------------------------------------------
  - id: warranty_info  # clusters 10, 27, 23 (P4)
    name: Warranty information
    domain: product
    definition: The customer wants to know what a warranty covers, when it starts, which terms apply, or how to register or extend it.
    includes:
      - Conflicting warranty terms between the website, card and brand
      - Registering an item or buying an extended warranty
      - Whether cover still applies without the warranty card
    excludes:
      - Getting a faulty item repaired or replaced (warranty_claim)
    boundaries:
      warranty_claim: Asking about cover, even without the card, is warranty_info; using it for a fault is warranty_claim.
    examples: [19, 299, 114, 247]
    kind: inform
    requires_verification: false
    participation: ai
    # Same agent as warranty_claim (v2): the two differ in risk, not knowledge, so a mix-up
    # between them reaches the right agent and costs one step.
    agent: warranty_agent

  - id: warranty_claim  # cluster 8
    name: Claim a repair under warranty
    domain: product
    definition: The customer asks for a faulty item to be repaired or replaced under warranty, or invokes the warranty for a fault.
    includes:
      - A missing warranty card when making a claim
      - A service centre that refused the repair
    excludes:
      - A fault reported without naming a remedy (initiate_return, which troubleshoots first)
      - A return or replacement within the return window (initiate_return)
    boundaries:
      initiate_return: Asking for a repair or invoking the warranty is warranty_claim; a fault with no remedy named, or a return, is initiate_return.
      warranty_info: Questions about cover alone, even with a lost card, are warranty_info.
    examples: [11, 449, 776]
    kind: act
    requires_verification: true
    participation: ai
    signoff_actions:
      - Replace or repair outside the warranty terms
    agent: warranty_agent

  - id: installation_help  # cluster 9
    name: Installation and setup help
    domain: product
    definition: The customer wants help installing, assembling or setting up an item, or asks who does the installation.
    includes:
      - Whether installation affects the warranty
      - Wall mounts and installation accessories
    examples: [8, 169, 794]
    kind: inform
    requires_verification: false
    participation: ai
    agent: knowledge_agent

  # --- Account and login --------------------------------------------------------------
  - id: login_verification  # clusters 4, 24 (P7)
    name: Can't log in or verify
    domain: account
    definition: The customer can't log in or complete a mobile or email verification, including when they don't know why. The procedure checks the account's state and branches. A locked account follows the unlock steps, a forgotten password gets a reset link to the registered email, and a code problem gets the code resent.
    includes:
      - Can't log in and doesn't know why
      - Codes that never arrive
      - Logging in with a mobile number
      - Questions about why they're being asked to verify their mobile or email
    excludes:
      - Signing up for a new account (signup_help)
    boundaries:
      account_lockout: If the customer says the account is locked after too many attempts, it's account_lockout; if they can't say why they can't log in, it's login_verification.
      password_reset: If the customer says they forgot their password or want to change it, it's password_reset.
      signup_help: Creating a new account is signup_help.
    examples: [220, 229, 131, 690]
    kind: act
    requires_verification: true
    participation: ai
    signoff_actions:
      - Change the phone number or email that codes are sent to
      - Unlock the account
    fraud_signals:
      - Asks for a code to be sent to a new number or address
      - Asks the agent to read out or bypass a one-time code
    agent: account_agent

  - id: account_lockout  # cluster 26 (P7)
    name: Unlock a locked account
    domain: account
    definition: The account is locked after too many failed verification attempts and the customer wants access back.
    includes:
      - Accounts blocked by too many verification code attempts
    boundaries:
      login_verification: If the customer can't log in but doesn't say the account is locked, it's login_verification, which checks.
    examples: [3, 321, 944]
    kind: act
    requires_verification: true
    participation: ai
    signoff_actions:
      - Unlock the account
    fraud_signals:
      - The customer says they didn't try to log in
      - The email or phone changed recently (backend check)
    agent: account_agent

  - id: password_reset  # cluster 33
    name: Reset or change password
    domain: account
    definition: The customer wants to change their password or reset a forgotten one. The procedure sends a reset link to the registered email only; it never sets, reads or asks for a password, and never asks for government ID numbers.
    includes:
      - Forgotten passwords
    excludes:
      - Someone else changed the password (fraud guard)
    boundaries:
      login_verification: Code or number verification problems are login_verification.
    examples: [116, 749, 757]
    kind: act
    requires_verification: true
    participation: ai
    fraud_signals:
      - Asks for the reset link to go to a different email address
    agent: account_agent

  - id: change_email  # cluster 28
    name: Change account email
    domain: account
    definition: The customer wants to change or add the email address on their account.
    includes:
      - Regaining access after an email change
    excludes:
      - Someone else changed the email (fraud guard)
    examples: [255, 755, 953]
    kind: act
    requires_verification: true
    participation: ai
    signoff_actions:
      - Change the account email
    fraud_signals:
      - Can't access the current email and can't verify another way
    agent: account_agent

  - id: reactivate_account  # cluster 19 (P9)
    name: Reactivate an account
    domain: account
    definition: The customer's account was deactivated or went inactive and they want it back.
    includes:
      - Accounts deactivated for inactivity
    boundaries:
      close_account: Reactivating restores access; closing removes it.
    examples: [32, 434, 733]
    kind: act
    requires_verification: true
    participation: ai
    signoff_actions:
      - Reactivate the account
    fraud_signals:
      - Asks to change the email or phone in the same conversation as reactivating
    agent: account_agent

  - id: close_account  # cluster 19 (P9). A risk route, kept despite 4 conversations.
    name: Close an account
    domain: account
    definition: The customer wants to deactivate or delete their account. Deletion carries data-protection obligations, so a person handles it.
    includes:
      - Deactivating an account
      - Deleting account data
    boundaries:
      reactivate_account: Closing removes access; reactivating restores it.
    examples: [111, 391, 777]
    kind: act
    requires_verification: true
    participation: handoff
    agent: human_support

  - id: signup_help  # clusters 35, 34 + sign-up goals from 4 (P10)
    name: Sign-up and account requirements
    domain: account
    definition: The customer wants to create a new account, or asks whether they need one to buy. No identity check is needed because there is no account yet.
    includes:
      - Signing up with a corporate email or an international phone number
      - Whether an account is needed to make a purchase
    boundaries:
      login_verification: An existing account that can't log in is login_verification.
    examples: [276, 436, 125, 489]
    kind: inform
    requires_verification: false
    participation: ai
    agent: account_agent

  # --- Shopping help before buying ----------------------------------------------------
  - id: ordering_help  # cluster 17 + payment goals from 15 (P5)
    name: How to order, pay and collect
    domain: shopping
    definition: The customer wants help placing an order, paying for it, or understanding how it will reach them.
    includes:
      - Payment options, including cash on delivery and why it isn't offered
      - Scheduled or in-store pickup
      - Combining orders from different sellers into one delivery
    examples: [267, 105, 499, 781]
    kind: inform
    requires_verification: false
    participation: ai
    agent: knowledge_agent

  - id: item_availability  # cluster 31
    name: Out-of-stock items
    domain: shopping
    definition: The customer wants an item that is out of stock, or asks when it will be back.
    includes:
      - Restock dates
    examples: [7, 78, 205]
    kind: inform
    requires_verification: false
    participation: ai
    agent: knowledge_agent

  - id: shipping_availability  # cluster 22
    name: Shipping to an unavailable location
    domain: shopping
    definition: The customer wants an item sent to a location it shows as unavailable for, including abroad.
    includes:
      - International shipping
    boundaries:
      faster_delivery: Speed of delivery to a supported location is faster_delivery.
    examples: [42, 323, 464]
    kind: inform
    requires_verification: false
    participation: ai
    agent: knowledge_agent

guards:
  - id: fraud_or_takeover
    name: Suspected fraud or account takeover
    definition: Someone other than the customer may have used, or be trying to use, their account, card or identity. Checked on every message; backend risk checks live in each intent's procedure.
    fires_on:
      - I never placed this order
      - There are charges on my card I didn't make
      - Someone changed my password or email
      - My account was hacked, or I got a code I didn't ask for
      - Asks the agent to read out, resend to a new number, or skip a one-time code
      - It's my husband's account, he asked me to sort it out
      - Send the refund to this other account instead
      - Send the reset link or code to this other email or number instead
    not_on:
      - My parcel was stolen from my doorstep (order_not_arrived)
      - The package arrived opened or tampered with (initiate_return)
      - I forgot my password (password_reset)
      - My account is locked after too many attempts (account_lockout)
      - A family member ordered on the account by mistake ("my son placed an order by mistake")
      - A charge on my order I don't recognise, asking what it is for (charge_dispute)
    participation: never

  - id: wants_human
    name: Asks for a human
    definition: The customer asks to speak to a person, supervisor or manager.
    fires_on:
      - I want to speak to your supervisor
      - Can I talk to a real person?
    not_on:
      - The agent decides to escalate on its own
      - Can you check with your team?
      - '"I need to talk to someone about my return", as a way of opening the conversation'
      - Agreeing to a transfer the agent suggested
    participation: handoff

  - id: complaint
    name: Complaint
    definition: The customer wants a complaint acted on. That means a formal complaint, compensation, a complaint about how staff or a courier behaved, or a threat to escalate outside BrownBox.
    fires_on:
      - I want to make a formal complaint
      - The courier was rude to me
      - I want compensation for this
      - I'll be reporting this
    not_on:
      - Frustration while still pursuing their request ("this is so annoying", "that's ridiculous", "this is unacceptable")
      - Dissatisfaction with nothing asked for ("I'm not happy with the service", "I expected better")
    participation: handoff

  - id: unsupported_language
    name: Unsupported language
    definition: The customer writes in a language BrownBox support doesn't cover.
    fires_on:
      - A message mostly in another language
    not_on:
      - English with a product or place name in another language
    participation: handoff
